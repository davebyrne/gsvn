# Minimal standalone config for the gsvn test server (runs as non-root).
ServerRoot "/etc/httpd"
ServerName localhost
Listen 8080
Listen 8443

LoadModule mpm_event_module      modules/mod_mpm_event.so
LoadModule unixd_module          modules/mod_unixd.so
LoadModule authn_core_module     modules/mod_authn_core.so
LoadModule authn_file_module     modules/mod_authn_file.so
LoadModule authz_core_module     modules/mod_authz_core.so
LoadModule authz_user_module     modules/mod_authz_user.so
LoadModule auth_basic_module     modules/mod_auth_basic.so
LoadModule log_config_module     modules/mod_log_config.so
LoadModule mime_module           modules/mod_mime.so
LoadModule env_module            modules/mod_env.so
LoadModule filter_module         modules/mod_filter.so
LoadModule ratelimit_module      modules/mod_ratelimit.so
LoadModule socache_shmcb_module  modules/mod_socache_shmcb.so
LoadModule ssl_module            modules/mod_ssl.so
LoadModule dav_module            modules/mod_dav.so
LoadModule dav_svn_module        modules/mod_dav_svn.so

DefaultRuntimeDir /tmp
PidFile /tmp/httpd.pid
Mutex file:/tmp default
TypesConfig /etc/mime.types

ErrorLog /dev/stderr
LogLevel warn
# Last field: request duration in microseconds.
LogFormat "%h %u %t \"%r\" %>s %b %D" timed
CustomLog /dev/stdout timed

# Large FSFS cache: without it a PROPFIND on a 100 000-entry directory
# re-parses the directory for every child (minutes instead of seconds).
SVNInMemoryCacheSize 262144
SVNCacheFullTexts On
SVNCacheTextDeltas On
SVNCacheRevProps On

KeepAlive On
MaxKeepAliveRequests 1000
Timeout 600

<Directory />
    AllowOverride None
    Require all denied
</Directory>

# Anonymous read access.
<Location /svn>
    DAV svn
    SVNParentPath /repos
    SVNListParentPath On
    Require all granted
</Location>

# HTTP Basic auth required (test / test).
<Location /auth>
    DAV svn
    SVNParentPath /repos
    SVNListParentPath On
    AuthType Basic
    AuthName "gsvn test"
    AuthBasicProvider file
    AuthUserFile /etc/httpd/gsvn.htpasswd
    Require valid-user
</Location>

# Bandwidth-limited (64 KiB/s) anonymous access, to simulate a slow link.
<Location /slow>
    DAV svn
    SVNParentPath /repos
    SVNListParentPath On
    Require all granted
    SetOutputFilter RATE_LIMIT
    SetEnv rate-limit 64
</Location>

SSLRandomSeed startup builtin
SSLRandomSeed connect builtin
SSLSessionCache shmcb:/tmp/ssl_scache(512000)

<VirtualHost *:8443>
    SSLEngine on
    SSLCertificateFile /etc/httpd/gsvn-tls/server.crt
    SSLCertificateKeyFile /etc/httpd/gsvn-tls/server.key

    <Location /svn>
        DAV svn
        SVNParentPath /repos
        SVNListParentPath On
        Require all granted
    </Location>

    <Location /auth>
        DAV svn
        SVNParentPath /repos
        SVNListParentPath On
        AuthType Basic
        AuthName "gsvn test"
        AuthBasicProvider file
        AuthUserFile /etc/httpd/gsvn.htpasswd
        Require valid-user
    </Location>
</VirtualHost>
